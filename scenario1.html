<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ภารกิจพิชิตสถานการณ์</title>
    
    <!-- Meta Tags สำหรับแชร์ลงโซเชียล/LINE ให้ดูน่าเชื่อถือและน่าสนใจ -->
    <meta property="og:title" content="ภารกิจพิชิตสถานการณ์">
    <meta property="og:description" content="ร่วมตอบคำถามและวิเคราะห์สถานการณ์จำลองชุมชนเพื่อหาทางออกร่วมกัน">
    <meta property="og:type" content="website">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #E8F5E9; /* สีพื้นหลังโทนเขียวอ่อนเดียวกับข้างในเพื่อความละมุน */
            font-family: sans-serif;
        }

        /* หน้าโหลดช่วงรอ Google Apps Script รันระบบครั้งแรก */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #E8F5E9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #A5D6A7;
            border-top: 5px solid #2E7D32;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #2E7D32;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        iframe {
            display: block;
            width: 100%;
            height: 100vh; 
            height: 100dvh; /* รองรับบราวเซอร์มือถือรุ่นใหม่เพื่อหลบแป้นพิมพ์และแถบที่อยู่เว็บ */
            border: none;
            opacity: 0; /* ซ่อนไว้ก่อนจนกว่าจะโหลดเสร็จเพื่อความเนียนตา */
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- 1. หน้าโหลดสำหรับแก้ปัญหา 'จอขาว' ตอนเริ่มต้น -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">กำลังเข้าสู่ระบบจำลอง...</div>
    </div>

    <!-- 2. Iframe หลักเชื่อมต่อไปยังระบบ Google Apps Script -->
    <iframe 
        id="app-iframe"
        src="https://script.google.com/macros/s/AKfycbxe1HMCiJEZqbpvFy6TTpQHOqkDhhxoastqSX0S7V6GTq18XaVFKFd_eeBU6PUkZaPR/exec"
        allow="camera; microphone; forms; geolocation; autoplay"
    ></iframe>

    <script>
        const iframe = document.getElementById('app-iframe');
        const loader = document.getElementById('loading-screen');

        // เมื่อ Iframe โหลดเสร็จแล้ว ค่อยๆ แสดงแบบทดสอบ และปิดหน้า Loading
        iframe.onload = function() {
            loader.style.opacity = '0';
            iframe.style.opacity = '1';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        };

        // ป้องกันกรณีผู้ใช้เผลอกดรีเฟรชหรือกดปิดแท็บโดยไม่ได้ตั้งใจ (Warning Before Exit)
        window.addEventListener('beforeunload', function (e) {
            // ข้อความเตือนส่วนใหญ่บราวเซอร์รุ่นใหม่จะแสดงข้อความมาตรฐานของตัวเองเพื่อความปลอดภัย
            const confirmationMessage = 'คุณกำลังทำภารกิจค้างไว้ หากออกจากหน้านี้ข้อมูลที่พิมพ์ไว้จะสูญหายทั้งหมด';
            (e || window.event).returnValue = confirmationMessage; 
            return confirmationMessage; 
        });
    </script>
</body>
</html>
