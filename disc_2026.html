<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ภารกิจทดสอบความเป็นผู้นำ 4 ทิศ</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="gasFrame" allow="camera; microphone; forms; geolocation; autoplay"></iframe>

    <script>
        // URL ของ Google Apps Script ของคุณ
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzTqkYYSO6EDjSNYFmFPtTaBeGRilfHjKUIMAAVXQ0D_QD9xZGo5Eu7_HdrwHdZ776W/exec";
        
        // ดึง Parameter (เช่น ?report=GET2-xxx) ที่ติดมากับ GitHub Pages แล้วส่งต่อเข้า iframe
        const params = window.location.search;
        document.getElementById("gasFrame").src = GAS_URL + params;
    </script>
</body>
</html>
