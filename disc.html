<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ภารกิจทดสอบความเป็นผู้นำ 4 ทิศ</title>
    <style>
        /* ล็อกหน้า Parent ไม่ให้เกิดการแย่ง Scroll หรือเด้งดึ๋ง */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed; /* จุดสำคัญ: ป้องกัน Scroll Fighting บนมือถือ */
            background-color: #f8fafc;
        }

        /* เปิดระบบ Momentum Scrolling ให้กับกรอบ Iframe */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* จุดสำคัญ: เปิดแรงเฉื่อยการเลื่อนแบบ Native iOS */
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-wrapper">
        <iframe id="gasFrame" allow="camera; microphone; forms; geolocation; autoplay" scrolling="yes"></iframe>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzTqkYYSO6EDjSNYFmFPtTaBeGRilfHjKUIMAAVXQ0D_QD9xZGo5Eu7_HdrwHdZ776W/exec";
        const params = window.location.search;
        document.getElementById("gasFrame").src = GAS_URL + params;
    </script>
</body>
</html>
